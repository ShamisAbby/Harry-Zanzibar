; Supervisor config for the Laravel queue worker (booking/contact/newsletter
; emails). Install with: sudo cp deploy/supervisor-queue-worker.conf
; /etc/supervisor/conf.d/harry-zanzibar-worker.conf, then
; sudo supervisorctl reread && sudo supervisorctl update && sudo supervisorctl start harry-zanzibar-worker:*
;
; Adjust user, directory, and numprocs for your server.

[program:harry-zanzibar-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/harry-zanzibar/backend/artisan queue:work --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/harry-zanzibar/backend/storage/logs/worker.log
stopwaitsecs=3600
